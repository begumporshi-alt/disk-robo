name: Release

# Builds Disk Robo and attaches the .app + .zip to a GitHub release.
# Trigger: push a tag like v0.2.0 — `git tag v0.2.0 && git push --tags`.
#
# The .app is ad-hoc signed (same as the local build) — users opening it on
# a Mac other than the build host will need to right-click → Open the first
# time, or you can switch the signing step to a Developer ID + notarization
# (see https://developer.apple.com/developer-id/ ).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # Manual run from the Actions tab

permissions:
  contents: write           # Required for creating the release

jobs:
  build:
    name: Build DiskRobo.app
    runs-on: macos-14        # macOS 14+ matches the app's deployment target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build & test
        run: |
          swift build -c release
          swift test

      - name: Regenerate app icon
        run: swift Scripts/generate-icon.swift

      - name: Build .app bundle
        run: ./Scripts/build-app.sh release

      - name: Zip the .app for distribution
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent DiskRobo.app DiskRobo.app.zip
          shasum -a 256 DiskRobo.app.zip | tee DiskRobo.app.zip.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiskRobo
          path: |
            build/DiskRobo.app
            build/DiskRobo.app.zip
            build/DiskRobo.app.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: DiskRobo
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DiskRobo.app
            dist/DiskRobo.app.zip
            dist/DiskRobo.app.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
